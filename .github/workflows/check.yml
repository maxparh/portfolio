name: Check portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Type check (Vue and Node API)
        run: npm run type-check
      - name: Tests (contact handler)
        run: npm test
      - name: Production build
        run: npm run build
