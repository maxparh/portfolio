services:
  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    ports:
      - '${SITE_PORT:-80}:3000'
    depends_on:
      database:
        condition: service_healthy
    networks: [web]

  database:
    build:
      context: .
      target: database
    restart: unless-stopped
    user: '${PORTFOLIO_UID:-0}:${PORTFOLIO_GID:-0}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOST: 0.0.0.0
      WORKER_HOST: 0.0.0.0
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PORTFOLIO_ADMIN_TOKEN: ${PORTFOLIO_ADMIN_TOKEN:-}
    volumes:
      - '${PORTFOLIO_DATA_DIR:-./data}:/app/data'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [web, queue]

  form-worker:
    build:
      context: .
      target: form-worker
    restart: unless-stopped
    environment:
      WORKER_API_URL: http://database:3001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
    depends_on:
      database:
        condition: service_healthy
    networks: [queue]

  # HTTPS: set DOMAIN and SITE_PORT=127.0.0.1:8080, then enable profile tls.
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web:
  queue:

volumes:
  caddy_data:
  caddy_config:
